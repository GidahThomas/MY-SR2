<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background:var(--bg);">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="usi-card text-center p-4" style="max-width:460px;">
    <div class="usi-card-body">
      <div class="icon-tint-danger d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width:72px;height:72px;">
        <i class="bi bi-shield-lock" style="font-size:2rem;"></i>
      </div>
      <h1 style="font-size:1.8rem;">403</h1>
      <h2 style="font-size:1.1rem;">Access Denied</h2>
      <p class="text-muted-usi">You do not have the required role or permission to view this page. If you believe this is a mistake, contact your System Admin.</p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <button class="btn btn-outline-secondary" onclick="window.history.back()"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
        <a class="btn btn-primary" href="#" id="dashboardLink" style="background:var(--primary);border-color:var(--primary);">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../data/users.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script>
  const user = USIAMS.auth.getCurrentUser();
  document.getElementById("dashboardLink").href = user ? USIAMS.navigation.dashboardHrefFor(user.role) : "../login.html";
</script>
</body>
</html>
