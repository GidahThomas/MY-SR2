<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - USIAMS</title>
<!-- include: app-styles -->
</head>
<body style="background:var(--bg);">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="usi-card text-center p-4" style="max-width:460px;">
    <div class="usi-card-body">
      <div class="icon-tint-info d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width:72px;height:72px;">
        <i class="bi bi-signpost-2" style="font-size:2rem;"></i>
      </div>
      <h1 style="font-size:1.8rem;">404</h1>
      <h2 style="font-size:1.1rem;">Page Not Found</h2>
      <p class="text-muted-usi">The page you are looking for does not exist, may have been moved, or the link is broken.</p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <button class="btn btn-outline-secondary" data-ui-action="back"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
        <a class="btn btn-primary" href="#" id="dashboardLink" style="background:var(--primary);border-color:var(--primary);">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>
<!-- include: error-scripts -->
</body>
</html>
