<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Structure - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Academic Structure</h1><p>University &rarr; College/Institute/School &rarr; Department &rarr; Programme hierarchy.</p></div>
      </div>

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabStructure">Organisational Structure</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabCurriculum">Curriculum</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabYears">Academic Years &amp; Semesters</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabStructure">
          <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary write-action" id="addUnitBtn" data-write-action style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add College / Institute / School</button>
          </div>
          <div id="structureTree"></div>
        </div>
        <div class="tab-pane fade" id="tabCurriculum">
          <div class="usi-card">
            <div class="usi-card-header">
              <h3>Programme Curriculum</h3>
              <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" id="curriculumProgramme" style="min-width:260px;"></select>
              </div>
            </div>
            <div class="usi-card-body">
              <div class="mb-3" id="curriculumLevelBadge"></div>
              <div id="curriculumContainer"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tabYears">
          <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary write-action" id="addYearBtn" data-write-action style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add Academic Year</button>
          </div>
          <div id="academicYearsList"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/academics.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","LECTURER","LIBRARIAN","HOSTEL_OFFICER"], (user) => {
    USIAMS.academicsPage.initPage(user);
  });
</script>
</body>
</html>
