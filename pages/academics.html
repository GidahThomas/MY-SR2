<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Structure - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Academic Structure</h1><p>University &rarr; College/Institute/School &rarr; Department &rarr; Programme hierarchy.</p></div>
      </div>

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabStructure">Organisational Structure</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabCurriculum">Curriculum</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabYears">Academic Years &amp; Semesters</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabStructure">
          <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary write-action" id="addUnitBtn" data-write-action style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add College / Institute / School</button>
          </div>
          <div id="structureTree"></div>
        </div>
        <div class="tab-pane fade" id="tabCurriculum">
          <div class="usi-card">
            <div class="usi-card-header">
              <h3>Programme Curriculum</h3>
              <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" id="curriculumProgramme" style="min-width:260px;"></select>
              </div>
            </div>
            <div class="usi-card-body">
              <div class="mb-3" id="curriculumLevelBadge"></div>
              <div id="curriculumContainer"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tabYears">
          <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary write-action" id="addYearBtn" data-write-action style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add Academic Year</button>
          </div>
          <div id="academicYearsList"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>
<script src="../data/grading-system.js"></script>
<script src="../data/academic-structure.js"></script>
<script src="../data/courses.js"></script>
<script src="../data/users.js"></script>
<script src="../data/students.js"></script>
<script src="../data/results.js"></script>
<script src="../data/registrations.js"></script>
<script src="../data/finance.js"></script>
<script src="../data/attendance.js"></script>
<script src="../data/timetable.js"></script>
<script src="../data/requests.js"></script>
<script src="../data/complaints.js"></script>
<script src="../data/notifications.js"></script>
<script src="../data/documents.js"></script>
<script src="../data/internship.js"></script>
<script src="../data/graduation.js"></script>
<script src="../data/alumni.js"></script>
<script src="../data/qa-flags.js"></script>
<script src="../data/audit-logs.js"></script>
<script src="../js/gpa.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/qa.js"></script>
<script src="../js/charts.js"></script>
<script src="../components/table.js"></script>
<script src="../components/cards.js"></script>
<script src="../components/sidebar.js"></script>
<script src="../components/navbar.js"></script>
<script src="../js/app.js"></script>
<script src="../js/academics.js"></script>
<script>
  const user = USIAMS.auth.requireAuth(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN"]);
  if (user) {
    USIAMS.app.mountShell(user);
    USIAMS.academicsPage.initPage(user);
  }
</script>
</body>
</html>
