<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration Dashboard - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div>
          <h1 id="welcomeName">Welcome!</h1>
          <p id="studentMetaLine">Loading overview...</p>
        </div>
      </div>

      <div class="dash-grid-stats" id="statGrid"></div>

      <div class="row g-3 mb-3" id="orgUnitStats"></div>

      <div class="row g-3 mb-3">
        <div class="col-12">
          <div class="section-title"><i class="bi bi-lightning-charge text-warning"></i>Quick Actions</div>
          <div class="row g-3" id="quickActionsGrid"></div>
        </div>
      </div>

      <div class="dash-grid-charts">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Student Population by College</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="populationByCollegeChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Student Population by Programme</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="populationByProgrammeChart"></canvas></div></div>
        </div>
      </div>

      <div class="dash-grid-charts">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Registration Trend</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="registrationTrendChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>GPA Distribution</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="gpaDistributionChart"></canvas></div></div>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header"><h3>Graduation Trend</h3></div>
        <div class="usi-card-body"><div class="chart-box"><canvas id="graduationTrendChart"></canvas></div></div>
      </div>

      <div class="usi-card mb-3 d-none" id="roleNeedsAttentionCard">
        <div class="usi-card-header"><h3 id="roleNeedsAttentionTitle"><i class="bi bi-exclamation-circle me-1"></i>Needs Attention</h3></div>
        <div class="usi-card-body" id="roleNeedsAttentionList"></div>
      </div>

      <div class="dash-grid-2col">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Recent Activities</h3></div>
          <div class="usi-card-body" id="recentActivitiesList"></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>System Health</h3></div>
          <div class="usi-card-body" id="systemHealthList"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts charts -->
<script src="../js/dashboard.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","SYSTEM_ADMIN","LIBRARIAN","HOSTEL_OFFICER"], (user) => {
    USIAMS.dashboard.renderAdminDashboard(user);
  });
</script>
</body>
</html>
