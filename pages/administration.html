<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Administration</h1><p>Manage users, roles, organisational units and system settings.</p></div>
      </div>

      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabUsers">Users</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabRoles">Roles &amp; Permissions</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabOrg">Organisational Units</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabSettings">System Settings</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabAudit">Audit Logs</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabUsers">
          <div class="usi-card">
            <div class="usi-card-body">
              <div class="table-toolbar">
                <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="userSearchInput" placeholder="Search users"></div>
                <select class="form-select" id="userRoleFilter" aria-label="Show users with role" style="max-width:240px;"></select>
                <select class="form-select" id="userStatusFilter" aria-label="Show users with status" style="max-width:170px;">
                  <option value="">All statuses</option>
                  <option value="Active">Active</option>
                  <option value="Pending">Pending approval</option>
                  <option value="Inactive">Inactive</option>
                </select>
                <button class="btn btn-primary write-action ms-auto" data-write-action id="addUserBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add User</button>
              </div>
              <div id="usersTableContainer"></div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tabRoles">
          <div class="usi-card"><div class="usi-card-header"><h3>System Roles</h3></div><div class="usi-card-body" id="rolesList"></div></div>
        </div>

        <div class="tab-pane fade" id="tabOrg">
          <div class="row g-3 mb-3" id="orgSummaryStats"></div>
          <a href="academics.html" class="btn btn-outline-primary"><i class="bi bi-diagram-3 me-1"></i>Manage Full Academic Structure</a>
        </div>

        <div class="tab-pane fade" id="tabSettings">
          <div class="usi-card"><div class="usi-card-header"><h3>System Settings</h3></div><div class="usi-card-body" id="systemSettingsList"></div></div>
        </div>

        <div class="tab-pane fade" id="tabAudit">
          <div class="usi-card">
            <div class="usi-card-body">
              <div class="table-toolbar" id="auditFilterWrap">
                <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" data-role="search" placeholder="Search audit logs"></div>
                <select class="form-select" data-role="action-filter" style="max-width:200px;">
                  <option value="">All Actions</option>
                  <option>LOGIN</option><option>LOGOUT</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option>
                  <option>REGISTER</option><option>RESULT_VIEW</option><option>PAYMENT</option><option>REQUEST_SUBMITTED</option>
                </select>
              </div>
              <div id="auditLogsTableContainer"></div>
            </div>
          </div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/audit-logs.js"></script>
<script src="../js/administration.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","SYSTEM_ADMIN","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN"], (user) => {
    USIAMS.administrationPage.initPage(user);
  });
</script>
</body>
</html>
