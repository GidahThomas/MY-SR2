<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">

        <button class="btn btn-outline-secondary" id="exportAlumniCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
      </div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="alumniSearchInput" placeholder="Search by name, reg number or employer"></div>

              <option value="">All Years</option>
              <option>2021</option><option>2022</option><option>2023</option>
            </select>
          </div>
          <div id="alumniTableContainer"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/alumni.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","LECTURER","LIBRARIAN","HOSTEL_OFFICER"], (user) => {
    USIAMS.alumniPage.initPage();
  });
</script>
