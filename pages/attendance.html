<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Attendance</h1><p id="attendanceStudentName">Loading...</p></div>
        <div class="usi-card p-2 px-3"><span class="text-muted-usi" style="font-size:.78rem;">Overall Attendance:</span> <strong id="overallAttendanceValue">0%</strong></div>
      </div>

      <div class="mb-3 d-none" id="studentSelectorWrap">
        <label class="form-label">Select Student</label>
        <select class="form-select" id="studentSelector" style="max-width:360px;"></select>
      </div>

      <div class="dash-grid-charts">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Attendance by Course</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="attendanceByCourseChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Attendance Trend</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="attendanceTrendChart"></canvas></div></div>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-header"><h3>Attendance Register</h3></div>
        <div class="usi-card-body">
          <div class="usi-table-wrap">
            <table class="usi-table">
              <thead><tr><th>Course</th><th>Lecturer</th><th>Total Classes</th><th>Attended</th><th>Missed</th><th>Attendance</th></tr></thead>
              <tbody id="attendanceTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>
<script src="../data/grading-system.js"></script>
<script src="../data/academic-structure.js"></script>
<script src="../data/courses.js"></script>
<script src="../data/users.js"></script>
<script src="../data/students.js"></script>
<script src="../data/results.js"></script>
<script src="../data/registrations.js"></script>
<script src="../data/finance.js"></script>
<script src="../data/attendance.js"></script>
<script src="../data/timetable.js"></script>
<script src="../data/requests.js"></script>
<script src="../data/complaints.js"></script>
<script src="../data/notifications.js"></script>
<script src="../data/calendar.js"></script>
<script src="../data/documents.js"></script>
<script src="../data/internship.js"></script>
<script src="../data/graduation.js"></script>
<script src="../data/alumni.js"></script>
<script src="../data/library.js"></script>
<script src="../data/hostel.js"></script>
<script src="../data/elearning.js"></script>
<script src="../data/admissions.js"></script>
<script src="../data/qa-flags.js"></script>
<script src="../data/audit-logs.js"></script>
<script src="../js/gpa.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/qa.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/library.js"></script>
<script src="../js/hostel.js"></script>
<script src="../js/elearning.js"></script>
<script src="../js/admissions.js"></script>
<script src="../components/table.js"></script>
<script src="../components/cards.js"></script>
<script src="../components/sidebar.js"></script>

<script>
  const user = USIAMS.auth.requireAuth();
  if (user) {
    USIAMS.app.mountShell(user);
    USIAMS.attendancePage.initPage(user);
  }
</script>
</body>
</html>
