<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Attendance</h1><p id="attendanceStudentName">Loading...</p></div>
        <div class="usi-card p-2 px-3"><span class="text-muted-usi" style="font-size:.78rem;">Overall Attendance:</span> <strong id="overallAttendanceValue">0%</strong></div>
      </div>

      <div class="mb-3 d-none" id="studentSelectorWrap">
        <label class="form-label">Select Student</label>
        <select class="form-select" id="studentSelector" style="max-width:360px;"></select>
      </div>

      <div class="dash-grid-charts">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Attendance by Course</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="attendanceByCourseChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Attendance Trend</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="attendanceTrendChart"></canvas></div></div>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-header"><h3>Attendance Register</h3></div>
        <div class="usi-card-body">
          <div class="usi-table-wrap">
            <table class="usi-table">
              <thead><tr><th>Course</th><th>Lecturer</th><th>Total Classes</th><th>Attended</th><th>Missed</th><th>Attendance</th></tr></thead>
              <tbody id="attendanceTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts charts -->
<script src="../js/attendance.page.js"></script>
<script>
  USIAMS.boot(null, (user) => {
    USIAMS.attendancePage.initPage(user);
  });
</script>
</body>
</html>
