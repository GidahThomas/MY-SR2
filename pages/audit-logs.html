<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Audit Logs</h1><p>System-wide activity trail. Read-only for every role, including System Admin.</p></div>
        <span class="read-only-badge"><i class="bi bi-eye"></i> Append-Only</span>
      </div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar" id="auditFilterWrap">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" data-role="search" placeholder="Search by user, action or entity"></div>
            <select class="form-select" data-role="action-filter" style="max-width:200px;">
              <option value="">All Actions</option>
              <option>LOGIN</option><option>LOGOUT</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option>
              <option>REGISTER</option><option>RESULT_VIEW</option><option>PAYMENT</option><option>REQUEST_SUBMITTED</option>
            </select>
          </div>
          <div id="auditLogsTableContainer"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/audit-logs.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","EXAMINATION_OFFICER"], (user) => {
    USIAMS.auditLogsModule.renderInto("auditLogsTableContainer", "auditFilterWrap");
  });
</script>
</body>
</html>
