<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Calendar - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Academic Calendar</h1><p>National public holidays and university calendar milestones for AY2025/2026.</p></div>
      </div>

      <div id="statGrid" class="dash-grid-stats mb-4"></div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="calendarSearchInput" placeholder="Search events"></div>
            <select class="form-select" id="calendarTypeFilter" style="max-width:220px;">
              <option value="">All Event Types</option>
              <option value="Public Holiday">Public Holidays</option>
              <option value="Academic Calendar">Academic Calendar</option>
            </select>
          </div>
          <div id="calendarTableContainer"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/calendar.js"></script>
<script>
  USIAMS.boot(null, (user) => {
    USIAMS.calendarPage.initPage(user);
  });
</script>
</body>
</html>
