<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaints - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Complaints</h1><p>Submit, track, assign and resolve complaints.</p></div>
        <button class="btn btn-primary write-action" data-write-action id="submitComplaintBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Submit Complaint</button>
      </div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="complaintSearchInput" placeholder="Search complaints"></div>
            <select class="form-select" id="complaintPriorityFilter" style="max-width:200px;">
              <option value="">All Priorities</option><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="URGENT">Urgent</option>
            </select>
            <select class="form-select" id="complaintRecipientFilter" style="max-width:260px;"></select>
          </div>
          <div id="complaintsTableContainer"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/complaints.js"></script>
<script>
  USIAMS.boot(null, (user) => {
    USIAMS.complaintsPage.initPage(user);
    if (user.role !== "STUDENT" && USIAMS.auth.isReadOnlyRole(user.role)) document.getElementById("submitComplaintBtn").remove();
  });
</script>
</body>
</html>
