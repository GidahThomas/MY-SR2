<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Management - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Course Management</h1><p>Maintain the university-wide course catalogue and prerequisites.</p></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="exportCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          <button class="btn btn-primary write-action" id="addCourseBtn" data-write-action style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add Course</button>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="courseSearchInput" placeholder="Search by code or title"></div>
            <select class="form-select" id="filterDept" style="max-width:240px;"></select>
            <select class="form-select" id="filterType" style="max-width:160px;"><option value="">All Types</option><option>Core</option><option>Elective</option></select>
            <select class="form-select" id="filterSemester" style="max-width:160px;"><option value="">All Semesters</option><option value="1">Semester 1</option><option value="2">Semester 2</option></select>
          </div>
          <div id="coursesTableContainer"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/courses.page.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","LECTURER","LIBRARIAN","HOSTEL_OFFICER"], (user) => {
    USIAMS.coursesPage.initPage(user);
  });
</script>
</body>
</html>
