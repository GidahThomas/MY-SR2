<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>E-Learning</h1><p>Course materials, assignments and submissions.</p></div>
      </div>

      <div class="elearn-intro mb-4" id="elearnIntro"></div>

      <div class="usi-card mb-4">
        <div class="usi-card-body">
          <label class="form-label">Course</label>
          <select class="form-select" id="courseSelect" style="max-width:420px;"></select>
        </div>
      </div>

      <div id="elearningContent" class="row g-4">
        <div class="col-lg-5">
          <h2 class="h5 mb-3">Materials</h2>
          <div id="materialsList"></div>
        </div>
        <div class="col-lg-7">
          <h2 class="h5 mb-3">Assignments</h2>
          <div id="assignmentsList"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script>
  USIAMS.boot(["STUDENT","LECTURER"], (user) => {
    // How e-learning works, from each side.
    const steps = user.role === "STUDENT"
      ? [["bi-download", "Download materials", "Notes, slides and readings your lecturers publish, plus links to lecture recordings."],
         ["bi-upload", "Submit assignments", "Upload your work before the due date. It is stored safely with your account."],
         ["bi-patch-check", "See your marks", "Each submission shows its score once your lecturer has graded it."]]
      : [["bi-cloud-arrow-up", "Publish materials", "Upload notes and slides, or add a link to a lecture recording."],
         ["bi-clipboard-plus", "Set assignments", "Give each one a due date and maximum score."],
         ["bi-check2-square", "Grade submissions", "Download students' work and record their marks."]];
    document.getElementById("elearnIntro").innerHTML = steps.map(([icon, title, text]) => `
      <div class="elearn-intro-item"><i class="bi ${icon}"></i><div><strong>${title}</strong><small>${text}</small></div></div>`).join("");
    USIAMS.elearningPage.initPage(user);
  });
</script>
</body>
</html>
