<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDOSO Elections - USIAMS</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">
      <div class="page-header">
        <div><h1>UDOSO Elections</h1><p>Vote once for each available student union position.</p></div>
      </div>
      <div id="electionAlert" class="alert d-none" role="alert"></div>
      <div id="electionContent"></div>
    </main>
  </div>
</div>
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/modal.js"></script>
<script src="../components/toast.js"></script>
<script src="../data/users.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/notifications.js"></script>
<script src="../components/sidebar.js"></script>
<script src="../components/navbar.js"></script>
<script src="../js/app.js"></script>
<script>
USIAMS.boot(["STUDENT"], async () => {
  const content = document.getElementById("electionContent");
  const alertBox = document.getElementById("electionAlert");
  // Which positions this student has already voted for. The server is the
  // authority on that, so the ballot is rebuilt from it after every vote
  // and a cast vote cannot be re-offered by a stale page.
  let votedPositions = [];

  function showAlert(message, type) {
    alertBox.textContent = message;
    alertBox.className = `alert alert-${type}`;
  }

  async function loadElection() {
    try {
      const result = await USIAMS.api.request("/api/elections/active");
      votedPositions = result.votedPositions || [];
      if (!result.election) {
        content.innerHTML = `<div class="usi-card"><div class="usi-card-body empty-state"><i class="bi bi-calendar-x"></i><div>No open UDOSO election is currently available.</div></div></div>`;
        return;
      }
      const election = result.election;
      content.innerHTML = `
        <div class="usi-card mb-3"><div class="usi-card-body">
          <div class="d-flex justify-content-between gap-3 flex-wrap"><div><h2 class="h4 mb-1">${USIAMS.util.escapeHtml(election.name)}</h2><p class="text-muted-usi mb-0">${USIAMS.util.escapeHtml(election.description || "")}</p></div><span class="status-badge status-active">Open</span></div>
        </div></div>
        <div class="row g-3">${election.positions.map(position => `
          <div class="col-12 col-lg-6"><div class="usi-card h-100"><div class="usi-card-header"><h3>${USIAMS.util.escapeHtml(position.name)}</h3></div><div class="usi-card-body">
            ${position.candidates.length ? `<div class="d-grid gap-2">${position.candidates.map(candidate => renderCandidate(position, candidate, election.id)).join("")}</div>` : `<div class="empty-state"><i class="bi bi-person-x"></i>No approved candidates for this position.</div>`}
          </div></div></div>`).join("")}</div>`;
      content.querySelectorAll("[data-vote]").forEach(button => button.addEventListener("click", () => castVote(button, election.id)));
    } catch (error) {
      showAlert(error.message || "Election data is unavailable.", "danger");
    }
  }

  function renderCandidate(position, candidate, electionId) {
    const alreadyVoted = votedPositions.includes(position.id);
    const action = alreadyVoted
      ? `<span class="status-badge status-active align-self-start"><i class="bi bi-check2-circle me-1"></i>Voted</span>`
      : `<button class="btn btn-primary btn-sm align-self-start" data-vote data-election="${electionId}" data-position="${position.id}" data-candidate="${candidate.id}"><i class="bi bi-check2-circle me-1"></i>Vote</button>`;
    return `<div class="border rounded p-3"><div class="d-flex justify-content-between gap-3"><div><strong>${USIAMS.util.escapeHtml(candidate.name)}</strong><p class="text-muted-usi small mb-0">${USIAMS.util.escapeHtml(candidate.manifesto || "No manifesto submitted.")}</p></div>${action}</div></div>`;
  }

  async function castVote(button, electionId) {
    if (!window.confirm("Submit your vote for this position? You cannot vote again for the same position.")) return;
    button.disabled = true;
    try {
      const result = await USIAMS.api.request("/api/elections/vote", {
        method: "POST",
        body: { electionId, positionId: button.dataset.position, candidateId: button.dataset.candidate }
      });
      showAlert(result.message, "success");
      await loadElection();
    } catch (error) {
      showAlert(error.message || "Vote could not be recorded.", "danger");
      button.disabled = false;
    }
  }

  await loadElection();
});
</script>
</body>
</html>
