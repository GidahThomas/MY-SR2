<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance & Fees - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Finance &amp; Fees</h1><p id="financeSubtitle">Loading...</p></div>
        <div class="d-flex gap-2 no-print" id="studentFinanceSection">
          <button class="btn btn-outline-secondary" id="viewInvoiceBtn"><i class="bi bi-receipt me-1"></i>View Invoice</button>
          <button class="btn btn-primary write-action" data-write-action id="makePaymentBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-credit-card me-1"></i>Make Payment</button>
        </div>
        <div class="no-print" id="adminFinanceSection"><button class="btn btn-outline-secondary" id="exportFinanceCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button></div>
      </div>

      <div class="dash-grid-stats" id="statGrid"></div>

      <div id="studentFinanceSection">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Payment History</h3></div>
          <div class="usi-card-body">
            <div class="usi-table-wrap">
              <table class="usi-table">
                <thead><tr><th>Date</th><th>Reference</th><th>Method</th><th>Amount</th><th>Status</th><th>Receipt</th></tr></thead>
                <tbody id="paymentHistoryBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="adminFinanceSection">
        <div class="dash-grid-charts">
          <div class="usi-card"><div class="usi-card-header"><h3>Collection Trend</h3></div><div class="usi-card-body"><div class="chart-box"><canvas id="collectionTrendChart"></canvas></div></div></div>
          <div class="usi-card"><div class="usi-card-header"><h3>Paid vs Outstanding</h3></div><div class="usi-card-body"><div class="chart-box"><canvas id="paidVsOutstandingChart"></canvas></div></div></div>
        </div>
        <div class="usi-card mb-3">
          <div class="usi-card-header"><h3>Fees Billed by Department</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="feesByProgrammeChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Recent Transactions</h3></div>
          <div class="usi-card-body">
            <div class="usi-table-wrap">
              <table class="usi-table">
                <thead><tr><th>Date</th><th>Student</th><th>Reference</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody id="transactionsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>

<script src="../data/courses.js"></script>

<script src="../data/students.js"></script>
<script src="../data/results.js"></script>

<script src="../data/finance.js"></script>
<script src="../data/attendance.js"></script>

<script>
  const user = USIAMS.auth.requireAuth(["STUDENT","FINANCE_OFFICER","UNIVERSITY_ADMIN","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","SYSTEM_ADMIN"]);
  if (user) {
    USIAMS.app.mountShell(user);
    USIAMS.financePage.initPage(user);
  }
</script>
</body>
</html>
