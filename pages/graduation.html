<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Clearance - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Graduation Clearance</h1><p id="graduationStudentName">Loading...</p></div>
        <div id="eligibilityBadge"></div>
      </div>

      <div class="mb-3 d-none" id="studentSelectorWrap">
        <label class="form-label">Select Student</label>
        <select class="form-select" id="studentSelector" style="max-width:360px;"></select>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-body">
          <div class="d-flex justify-content-between mb-1" style="font-size:.82rem;">
            <strong>Clearance Progress</strong><span id="graduationProgressLabel">0% Complete</span>
          </div>
          <div class="attendance-bar" style="height:12px;"><div id="graduationProgressBar" style="width:0%;background:var(--primary);"></div></div>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header"><h3>Clearance Checklist</h3></div>
        <div class="usi-card-body" id="checklistContainer"></div>
      </div>

      <div class="d-flex justify-content-end">
        <button class="btn btn-primary write-action" data-write-action id="submitApplicationBtn" style="background:var(--primary);border-color:var(--primary);"></button>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/graduation.js"></script>
<script>
  USIAMS.boot(["STUDENT","REGISTRATION_OFFICER","HEAD_OF_DEPARTMENT","UNIVERSITY_ADMIN"], (user) => {
    USIAMS.graduationPage.initPage(user);
  });
</script>
</body>
</html>
