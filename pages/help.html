<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Centre - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Help Centre</h1><p id="helpSubtitle">How to use USIAMS, step by step.</p></div>
        <div class="d-flex gap-2 no-print">
          <button type="button" class="btn btn-primary" id="startTourBtn"><i class="bi bi-signpost-2 me-1"></i>Start the tour</button>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header"><h3><i class="bi bi-rocket-takeoff me-2"></i>Getting started</h3></div>
        <div class="usi-card-body">
          <ol class="help-steps" id="gettingStarted"></ol>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header"><h3><i class="bi bi-grid me-2"></i>Services at a glance</h3></div>
        <div class="usi-card-body">
          <div class="service-areas" id="serviceAreas"></div>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header">
          <h3><i class="bi bi-book me-2"></i>How do I...?</h3>
          <div class="search-box" style="max-width:320px;"><i class="bi bi-search"></i><input type="search" class="form-control" id="helpSearch" placeholder="Search guides, e.g. pay, register, results" aria-label="Search guides"></div>
        </div>
        <div class="usi-card-body">
          <div class="accordion" id="helpGuides"></div>
          <div class="empty-state d-none" id="helpNoResults"><i class="bi bi-search"></i>No guide matches that. Try another word, or ask through Requests.</div>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-header"><h3><i class="bi bi-chat-left-dots me-2"></i>Common questions</h3></div>
        <div class="usi-card-body">
          <div class="accordion" id="helpFaq"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/help.js"></script>
<script>
  USIAMS.boot(null, (user) => {
    const { escapeHtml } = USIAMS.util;
    const isStudent = user.role === "STUDENT";
    document.getElementById("helpSubtitle").textContent =
      `Guides for your role (${user.roleLabel || user.role}): what each page is for and how to do each task.`;

    // Getting started - the basics every new user needs.
    const basics = [
      "Use the menu on the left to open any service. On a phone, tap the menu button at the top left.",
      "Your Dashboard is your home page: it summarises what needs your attention.",
      "On any page, click the ? button in the top bar for step-by-step help with that page.",
      "The bell shows new notifications; the moon/sun button switches dark mode.",
      "Change your password in Settings. If you were given a temporary password, change it now.",
      isStudent
        ? "Start with Complete My Profile, read the Student By-Laws, register for your courses and pay your fees."
        : "Your menu only shows the pages your role uses. Ask an administrator if you need access to more.",
      "Sign out from the menu under your name (top right) when you finish, especially on a shared computer."
    ];
    document.getElementById("gettingStarted").innerHTML = basics.map(b => `<li>${escapeHtml(b)}</li>`).join("");

    // Every service by area. A service links to its page when this role
    // has that page in its menu; otherwise it is shown for information.
    const myPages = new Set(USIAMS.navigation.menuForRole(user.role).map(item => item.href));
    const AREAS = [
      { title: "Academics", icon: "bi-mortarboard-fill", items: [
        ["bi-journal-check", "Course registration", "Register 6 or 7 courses; prerequisites and credit limits are checked for you.", "pages/registration.html"],
        ["bi-calendar-week", "Timetable & attendance", "Weekly schedule, the daily class checklist and class reminders.", "pages/timetable.html"],
        ["bi-bar-chart-line", "Results & GPA", "Semester results, GPA and an unofficial transcript.", "pages/results.html"],
        ["bi-laptop", "E-learning", "Course materials to download, assignments to submit, and marks.", "pages/elearning.html"]
      ] },
      { title: "Finance & campus", icon: "bi-wallet2", items: [
        ["bi-receipt-cutoff", "Fees through GePG", "Get a GePG control number and pay through Government Payments.", "pages/finance.html"],
        ["bi-book", "Library", "Search the catalogue, borrow books and track your loans.", "pages/library.html"],
        ["bi-building", "Hostel", "Request accommodation and see your room allocation.", "pages/hostel.html"],
        ["bi-folder2-open", "Documents", "Upload your certificates and download them any time.", "pages/documents.html"]
      ] },
      { title: "Support & community", icon: "bi-people-fill", items: [
        ["bi-chat-left-dots", "Requests & complaints", "Reach the right office and follow each case to the end.", "pages/requests.html"],
        ["bi-megaphone", "Announcements", "University notices and your personal notifications.", "pages/announcements.html"],
        ["bi-check2-square", "Elections", "Student elections, one vote per position.", "pages/elections.html"],
        ["bi-award", "Graduation clearance", "Clearance from each office, tracked step by step.", "pages/graduation.html"]
      ] }
    ];
    const root = USIAMS.auth.getBasePath();
    document.getElementById("serviceAreas").innerHTML = AREAS.map(area => `
      <section class="service-area">
        <h4><i class="bi ${area.icon}"></i>${escapeHtml(area.title)}</h4>
        <ul>${area.items.map(([icon, name, text, href]) => {
          const body = `<i class="bi ${icon}"></i><span><strong>${escapeHtml(name)}</strong><small>${escapeHtml(text)}</small></span>`;
          return myPages.has(href) ? `<li><a href="${root}${href}">${body}</a></li>` : `<li><div>${body}</div></li>`;
        }).join("")}</ul>
      </section>`).join("");

    // One accordion item per page this role can open.
    const guides = USIAMS.help.guidesFor(user);
    const base = USIAMS.auth.getBasePath();
    const list = document.getElementById("helpGuides");
    list.innerHTML = guides.map((g, i) => `
      <div class="accordion-item" data-search="${escapeHtml((g.title + " " + g.intro + " " + g.steps.join(" ")).toLowerCase())}">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#guide${i}" aria-expanded="false" aria-controls="guide${i}">
            <span><strong>${escapeHtml(g.title)}</strong><span class="text-muted-usi d-block" style="font-size:.8rem;">${escapeHtml(g.intro)}</span></span>
          </button>
        </h2>
        <div id="guide${i}" class="accordion-collapse collapse" data-bs-parent="#helpGuides">
          <div class="accordion-body">
            <ol class="help-steps">${g.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ol>
            ${g.page !== "help.html" ? `<a class="btn btn-sm btn-outline-primary mt-2" href="${base}pages/${g.page}">Go to this page <i class="bi bi-arrow-right"></i></a>` : ""}
          </div>
        </div>
      </div>`).join("");

    const search = document.getElementById("helpSearch");
    search.addEventListener("input", () => {
      const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
      let shown = 0;
      list.querySelectorAll(".accordion-item").forEach(item => {
        const match = words.every(w => item.dataset.search.includes(w));
        item.classList.toggle("d-none", !match);
        if (match) shown++;
      });
      document.getElementById("helpNoResults").classList.toggle("d-none", shown > 0);
    });

    // Questions new users ask.
    const faq = [
      ["I forgot my password.", "On the sign-in page click Forgot Password? Click Here, enter your username and account email, and choose a new password."],
      ["How do new staff get an account?", "Staff accounts are added by a university administrator under Administration > Users, who gives the new member of staff a username and temporary password. Only students create their own accounts on the sign-in page."],
      ...(isStudent ? [
        ["How do I pay university fees?", "Every payment is a government payment through GePG. Open Finance > Make Payment, choose what you are paying for, and pay the GePG control number using the Government Payments (GePG) option of your mobile money or bank."],
        ["My control number expired.", "GePG control numbers are valid for 7 days. Open Finance > Make Payment and choose the item again to get a new one."],
        ["I paid but my balance did not change.", "Only tuition payments reduce the tuition balance. Other fees (transcript, accommodation...) are separate. Check Payment History for the payment and its receipt."],
        ["I cannot find a course to register for.", "Available Courses only lists courses open to your programme and year. Ask your Academic Advisor through Requests."]
      ] : [
        ["How do I add a user?", "Open Administration > Users, click Add User, choose the role first, then fill in the details. Only administrators see this."],
        ["A page I need is not in my menu.", "Each role sees only its own pages. Ask a University or System Admin to change your role if you need more access."]
      ]),
      ["Who do I ask for help?", "Use Requests to ask the right office, or Complaints if something went wrong."]
    ];
    document.getElementById("helpFaq").innerHTML = faq.map(([q, a], i) => `
      <div class="accordion-item">
        <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq${i}" aria-expanded="false" aria-controls="faq${i}">${escapeHtml(q)}</button></h2>
        <div id="faq${i}" class="accordion-collapse collapse" data-bs-parent="#helpFaq"><div class="accordion-body">${escapeHtml(a)}</div></div>
      </div>`).join("");

    document.getElementById("startTourBtn").addEventListener("click", () => USIAMS.help.startTour(user));
  });
</script>
</body>
</html>
