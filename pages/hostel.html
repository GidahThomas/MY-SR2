<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostel &amp; Accommodation - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Hostel &amp; Accommodation</h1><p>Hall occupancy and student accommodation requests.</p></div>
      </div>

      <div id="staffHostelSection" class="d-none">
        <div id="statGrid" class="dash-grid-stats mb-4"></div>
        <div class="usi-card mb-4">
          <div class="usi-card-header"><h3>Rooms</h3></div>
          <div class="usi-card-body">
            <div class="table-toolbar"><div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="roomsSearchInput" placeholder="Search by room number"></div></div>
            <div id="roomsTableContainer"></div>
          </div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Allocation Requests</h3></div>
          <div class="usi-card-body">
            <div class="table-toolbar"><div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="allocationsSearchInput" placeholder="Search by student"></div></div>
            <div id="allocationsTableContainer"></div>
          </div>
        </div>
      </div>

      <div id="studentHostelSection" class="d-none">
        <div id="myAccommodationContainer"></div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script>
  USIAMS.boot(["STUDENT","HOSTEL_OFFICER","UNIVERSITY_ADMIN","SYSTEM_ADMIN"], (user) => {
    USIAMS.hostelPage.initPage(user);
  });
</script>
</body>
</html>
