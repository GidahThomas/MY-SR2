<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Dashboard - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div>
          <h1 id="welcomeName">Welcome!</h1>
          <p id="studentMetaLine">Loading overview...</p>
        </div>
      </div>

      <div class="dash-grid-stats" id="statGrid"></div>

      <div class="row g-3 mb-3">
        <div class="col-12">
          <div class="section-title"><i class="bi bi-lightning-charge text-warning"></i>Quick Actions</div>
          <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-2"><a href="students.html" class="quick-action-tile"><i class="bi bi-people"></i><span>My Students</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="results.html" class="quick-action-tile"><i class="bi bi-pencil-square"></i><span>Enter Results</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="attendance.html" class="quick-action-tile"><i class="bi bi-calendar-check"></i><span>Attendance</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="timetable.html" class="quick-action-tile"><i class="bi bi-calendar3-week"></i><span>My Timetable</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="elearning.html" class="quick-action-tile"><i class="bi bi-laptop"></i><span>E-Learning</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="calendar.html" class="quick-action-tile"><i class="bi bi-calendar3"></i><span>Academic Calendar</span></a></div>
          </div>
        </div>
      </div>

      <div class="dash-grid-2col">
        <div class="usi-card">
          <div class="usi-card-header"><h3>My Courses</h3></div>
          <div class="usi-card-body" id="myCoursesList"></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>My Timetable</h3></div>
          <div class="usi-card-body" id="myTimetableList"></div>
        </div>
      </div>

      <div class="usi-card mt-3">
        <div class="usi-card-header"><h3><i class="bi bi-pencil-square me-1"></i>Needs Grading</h3></div>
        <div class="usi-card-body" id="needsGradingList"></div>
      </div>

      <div class="usi-card mt-3">
        <div class="usi-card-header"><h3><i class="bi bi-megaphone me-1"></i>Announcements</h3></div>
        <div class="usi-card-body p-0" id="announcementsList"></div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts charts -->
<script src="../js/dashboard.js"></script>
<script>
  USIAMS.boot(["LECTURER"], (user) => {
    USIAMS.dashboard.renderLecturerDashboard(user);
  });
</script>
</body>
</html>
