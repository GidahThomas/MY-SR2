<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Library</h1><p>Browse the catalog and track book loans.</p></div>
      </div>

      <div id="staffLibrarySection" class="d-none">
        <div id="statGrid" class="dash-grid-stats mb-4"></div>
        <div class="usi-card mb-4">
          <div class="usi-card-header"><h3>Catalog</h3></div>
          <div class="usi-card-body">
            <div class="table-toolbar"><div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="staffCatalogSearchInput" placeholder="Search by title, author or category"></div></div>
            <div id="staffCatalogTableContainer"></div>
          </div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>All Loans</h3></div>
          <div class="usi-card-body">
            <div class="table-toolbar"><div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="loansSearchInput" placeholder="Search by student or book"></div></div>
            <div id="loansTableContainer"></div>
          </div>
        </div>
      </div>

      <div id="studentLibrarySection" class="d-none">
        <div class="usi-card mb-4">
          <div class="usi-card-header"><h3>Catalog</h3></div>
          <div class="usi-card-body">
            <div class="table-toolbar"><div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="studentCatalogSearchInput" placeholder="Search by title, author or category"></div></div>
            <div id="studentCatalogTableContainer"></div>
          </div>
        </div>
        <h2 class="h5 mb-3">My Loans</h2>
        <div id="myLoansContainer"></div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script>
  USIAMS.boot(["STUDENT","LIBRARIAN","UNIVERSITY_ADMIN","SYSTEM_ADMIN"], (user) => {
    USIAMS.libraryPage.initPage(user);
  });
</script>
</body>
</html>
