<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality Assurance Dashboard - USIAMS</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div>
          <h1 id="welcomeName">Welcome!</h1>
          <p id="studentMetaLine">Loading overview...</p>
        </div>
        <span class="read-only-badge"><i class="bi bi-eye"></i> Read-Only Access</span>
      </div>

      <div class="dash-grid-stats" id="statGrid"></div>

      <div class="row g-3 mb-3">
        <div class="col-12">
          <div class="section-title"><i class="bi bi-lightning-charge text-warning"></i>Quick Links</div>
          <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-2"><a href="students.html" class="quick-action-tile"><i class="bi bi-people"></i><span>View Students</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="results.html" class="quick-action-tile"><i class="bi bi-clipboard-data"></i><span>View Results</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="quality-assurance.html" class="quick-action-tile"><i class="bi bi-flag"></i><span>Quality Flags</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="reports.html" class="quick-action-tile"><i class="bi bi-bar-chart-line"></i><span>View Reports</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="audit-logs.html" class="quick-action-tile"><i class="bi bi-shield-lock"></i><span>Audit Logs</span></a></div>
            <div class="col-6 col-md-4 col-lg-2"><a href="calendar.html" class="quick-action-tile"><i class="bi bi-calendar3"></i><span>Academic Calendar</span></a></div>
          </div>
        </div>
      </div>

      <div class="dash-grid-2col">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Quality Indicators</h3></div>
          <div class="usi-card-body" id="qualityIndicatorsList"></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Population by College</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="populationByCollegeChart"></canvas></div></div>
        </div>
      </div>

      <div class="dash-grid-charts">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Registration Trend</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="registrationTrendChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>GPA Distribution</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="gpaDistributionChart"></canvas></div></div>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header"><h3>Student Population by Programme</h3></div>
        <div class="usi-card-body"><div class="chart-box"><canvas id="populationByProgrammeChart"></canvas></div></div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/chart.js/chart.umd.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>

<script src="../data/requests.js"></script>
<script src="../data/complaints.js"></script>
<script src="../data/notifications.js"></script>
<script src="../data/calendar.js"></script>
<script src="../data/announcements.js"></script>
<script src="../data/documents.js"></script>
<script src="../data/internship.js"></script>
<script src="../data/graduation.js"></script>
<script src="../data/alumni.js"></script>
<script src="../data/library.js"></script>

<script src="../data/elearning.js"></script>
<script src="../data/admissions.js"></script>
<script src="../data/qa-flags.js"></script>
<script src="../data/audit-logs.js"></script>
<script src="../js/gpa.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/qa.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/library.js"></script>
<script src="../js/hostel.js"></script>

<script src="../js/admissions.js"></script>
<script src="../js/announcements.js"></script>
<script src="../components/table.js"></script>

<script src="../components/sidebar.js"></script>

<script>

    USIAMS.dashboard.renderQaDashboard(user);
  });
</script>
</body>
</html>
