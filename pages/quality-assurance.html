<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quality Assurance - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Quality Assurance</h1><p>Data quality flags and academic quality indicators across the university.</p></div>
      </div>

      <div class="dash-grid-2col">
        <div class="usi-card">
          <div class="usi-card-header"><h3>GPA Distribution</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="qaGpaDistributionChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Quality Indicators</h3></div>
          <div class="usi-card-body" id="qualityIndicatorsList"></div>
        </div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-header"><h3>Department Performance (Average GPA)</h3></div>
        <div class="usi-card-body"><div class="chart-box"><canvas id="departmentPerformanceChart"></canvas></div></div>
      </div>

      <div class="usi-card">
        <div class="usi-card-header">
          <h3>Quality Flags</h3>
          <div class="d-flex gap-2">
            <select class="form-select form-select-sm" id="flagCategoryFilter"></select>
            <select class="form-select form-select-sm" id="flagStatusFilter">
              <option value="">All Statuses</option><option value="OPEN">Open</option><option value="UNDER_REVIEW">Under Review</option><option value="RESOLVED">Resolved</option>
            </select>
            <button class="btn btn-outline-secondary btn-sm" id="exportFlagsCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          </div>
        </div>
        <div class="usi-card-body" id="flagsList"></div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts charts -->
<script src="../js/quality-assurance.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","QUALITY_ASSURANCE_OFFICER","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","SYSTEM_ADMIN"], (user) => {
    USIAMS.qaPage.initPage(user);
  });
</script>
</body>
</html>
