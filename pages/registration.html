<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Registration - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Course Registration</h1><p id="regStudentName">Loading student...</p></div>
      </div>

      <div class="mb-3 d-none" id="studentSelectorWrap">
        <label class="form-label">Select Student</label>
        <select class="form-select" id="studentSelector" style="max-width:360px;"></select>
      </div>

      <div class="dash-grid-stats" style="grid-template-columns:repeat(4,1fr);">
        <div class="usi-card p-3"><div class="stat-label">Academic Year</div><div class="stat-value" style="font-size:1.1rem;" id="regAcademicYear">-</div></div>
        <div class="usi-card p-3"><div class="stat-label">Semester</div><div class="stat-value" style="font-size:1.1rem;" id="regSemester">-</div></div>
        <div class="usi-card p-3"><div class="stat-label">Registration Period</div><div class="mt-1" id="regPeriod">-</div></div>
        <div class="usi-card p-3"><div class="stat-label">Status</div><div class="mt-1" id="regStatusValue">-</div></div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div><strong>Total Credits: <span id="totalCreditsValue">0</span></strong> <span class="text-muted-usi">(Allowed range: <span id="creditLimitValue"></span>)</span></div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary d-none write-action" data-write-action id="amendRegistrationBtn"><i class="bi bi-pencil me-1"></i>Amend Registration</button>
            <button class="btn btn-primary write-action" data-write-action id="confirmRegistrationBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-check2-circle me-1"></i>Confirm Registration</button>
          </div>
        </div>
      </div>

      <div class="dash-grid-2col">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Available Courses</h3></div>
          <div class="usi-card-body" id="availableCoursesList"></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Selected Courses</h3></div>
          <div class="usi-card-body" id="selectedCoursesList"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>
<script src="../data/grading-system.js"></script>
<script src="../data/academic-structure.js"></script>
<script src="../data/courses.js"></script>
<script src="../data/users.js"></script>
<script src="../data/students.js"></script>
<script src="../data/results.js"></script>
<script src="../data/registrations.js"></script>
<script src="../data/finance.js"></script>
<script src="../data/attendance.js"></script>
<script src="../data/timetable.js"></script>
<script src="../data/requests.js"></script>
<script src="../data/complaints.js"></script>
<script src="../data/notifications.js"></script>
<script src="../data/documents.js"></script>
<script src="../data/internship.js"></script>
<script src="../data/graduation.js"></script>
<script src="../data/alumni.js"></script>
<script src="../data/library.js"></script>
<script src="../data/hostel.js"></script>
<script src="../data/elearning.js"></script>
<script src="../data/admissions.js"></script>
<script src="../data/qa-flags.js"></script>
<script src="../data/audit-logs.js"></script>
<script src="../js/gpa.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/qa.js"></script>
<script src="../js/charts.js"></script>
<script src="../components/table.js"></script>
<script src="../components/cards.js"></script>
<script src="../components/sidebar.js"></script>
<script src="../components/navbar.js"></script>
<script src="../js/app.js"></script>
<script src="../js/registration.js"></script>
<script>
  const user = USIAMS.auth.requireAuth(["STUDENT","REGISTRATION_OFFICER","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","UNIVERSITY_ADMIN","QUALITY_ASSURANCE_OFFICER"]);
  if (user) {
    USIAMS.app.mountShell(user);
    USIAMS.registrationPage.initPage(user);
  }
</script>
</body>
</html>
