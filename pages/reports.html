<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Reports</h1><p>Generate, print and export university-wide reports.</p></div>
      </div>

      <div class="usi-card mb-3 no-print">
        <div class="usi-card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Report Category</label>
              <select class="form-select" id="reportType">
                <option value="student">Student Report</option>
                <option value="registration">Registration Report</option>
                <option value="results">Results Report</option>
                <option value="gpa">GPA Report</option>
                <option value="course">Course Report</option>
                <option value="programme">Programme Report</option>
                <option value="department">Department Report</option>
                <option value="college">College Report</option>
                <option value="finance">Finance Report</option>
                <option value="attendance">Attendance Report</option>
                <option value="graduation">Graduation Report</option>
                <option value="qa">Quality Assurance Report</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Academic Year</label>
              <select class="form-select" id="reportAcademicYear">
                <option value="">All Years</option>
                <option>2023/2024</option><option>2024/2025</option><option selected>2025/2026</option>
              </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
              <button class="btn btn-primary flex-grow-1" id="generateReportBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-play-fill me-1"></i>Generate</button>
            </div>
            <div class="col-md-3 d-flex gap-2 justify-content-end">
              <button class="btn btn-outline-secondary" id="printReportBtn"><i class="bi bi-printer"></i></button>
              <button class="btn btn-outline-secondary" id="exportReportCsvBtn"><i class="bi bi-download"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="usi-card print-doc">
        <div class="usi-card-header"><h3 id="reportResultTitle">Report</h3></div>
        <div class="usi-card-body">
          <div class="usi-table-wrap" id="reportTableWrap"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/reports.js"></script>
<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","LECTURER","LIBRARIAN","HOSTEL_OFFICER"], (user) => {
    USIAMS.reportsPage.initPage(user);
  });
</script>
</body>
</html>
