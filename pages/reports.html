<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Reports</h1><p>Generate, print and export university-wide reports.</p></div>
      </div>

      <div class="usi-card mb-3 no-print">
        <div class="usi-card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Report Category</label>
              <select class="form-select" id="reportType">
                <option value="student">Student Report</option>
                <option value="registration">Registration Report</option>
                <option value="results">Results Report</option>
                <option value="gpa">GPA Report</option>
                <option value="course">Course Report</option>
                <option value="programme">Programme Report</option>
                <option value="department">Department Report</option>
                <option value="college">College Report</option>
                <option value="finance">Finance Report</option>
                <option value="attendance">Attendance Report</option>
                <option value="graduation">Graduation Report</option>
                <option value="qa">Quality Assurance Report</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Academic Year</label>
              <select class="form-select" id="reportAcademicYear">
                <option value="">All Years</option>
                <option>2023/2024</option><option>2024/2025</option><option selected>2025/2026</option>
              </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
              <button class="btn btn-primary flex-grow-1" id="generateReportBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-play-fill me-1"></i>Generate</button>
            </div>
            <div class="col-md-3 d-flex gap-2 justify-content-end">
              <button class="btn btn-outline-secondary" id="printReportBtn"><i class="bi bi-printer"></i></button>
              <button class="btn btn-outline-secondary" id="exportReportCsvBtn"><i class="bi bi-download"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="usi-card print-doc">
        <div class="usi-card-header"><h3 id="reportResultTitle">Report</h3></div>
        <div class="usi-card-body">
          <div class="usi-table-wrap" id="reportTableWrap"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>
<script src="../data/grading-system.js"></script>
<script src="../data/academic-structure.js"></script>
<script src="../data/courses.js"></script>
<script src="../data/users.js"></script>
<script src="../data/students.js"></script>
<script src="../data/results.js"></script>
<script src="../data/registrations.js"></script>
<script src="../data/finance.js"></script>
<script src="../data/attendance.js"></script>
<script src="../data/timetable.js"></script>
<script src="../data/requests.js"></script>
<script src="../data/complaints.js"></script>
<script src="../data/notifications.js"></script>
<script src="../data/documents.js"></script>
<script src="../data/internship.js"></script>
<script src="../data/graduation.js"></script>
<script src="../data/alumni.js"></script>
<script src="../data/qa-flags.js"></script>
<script src="../data/audit-logs.js"></script>
<script src="../js/gpa.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/qa.js"></script>
<script src="../js/charts.js"></script>
<script src="../components/table.js"></script>
<script src="../components/cards.js"></script>
<script src="../components/sidebar.js"></script>
<script src="../components/navbar.js"></script>
<script src="../js/app.js"></script>
<script src="../js/reports.js"></script>
<script>
  const user = USIAMS.auth.requireAuth(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","LECTURER"]);
  if (user) {
    USIAMS.app.mountShell(user);
    USIAMS.reportsPage.initPage();
  }
</script>
</body>
</html>
