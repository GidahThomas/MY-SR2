<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Requests</h1><p>Submit and track transcript, letter, clearance and other academic requests.</p></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="exportRequestsCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          <button class="btn btn-primary write-action" data-write-action id="submitRequestBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Submit Request</button>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="requestSearchInput" placeholder="Search requests"></div>
            <select class="form-select" id="requestStatusFilter" style="max-width:200px;">
              <option value="">All Statuses</option>
              <option value="PENDING">Pending</option><option value="IN_PROGRESS">In Progress</option>
              <option value="RESOLVED">Resolved</option><option value="REJECTED">Rejected</option>
              <option value="ESCALATED">Escalated</option><option value="CLOSED">Closed</option>
            </select>
          </div>
          <div id="requestsTableContainer"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../components/toast.js"></script>

<script src="../data/grading-system.js"></script>
<script src="../data/academic-structure.js"></script>
<script src="../data/courses.js"></script>
<script src="../data/users.js"></script>
<script src="../data/students.js"></script>
<script src="../data/results.js"></script>
<script src="../data/registrations.js"></script>
<script src="../data/finance.js"></script>
<script src="../data/attendance.js"></script>
<script src="../data/timetable.js"></script>
<script src="../data/requests.js"></script>
<script src="../data/complaints.js"></script>
<script src="../data/notifications.js"></script>
<script src="../data/calendar.js"></script>

<script src="../data/internship.js"></script>

<script src="../data/alumni.js"></script>
<script src="../data/library.js"></script>
<script src="../data/hostel.js"></script>
<script src="../data/elearning.js"></script>
<script src="../data/admissions.js"></script>
<script src="../data/qa-flags.js"></script>
<script src="../data/audit-logs.js"></script>
<script src="../js/gpa.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/qa.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/library.js"></script>
<script src="../js/hostel.js"></script>
<script src="../js/elearning.js"></script>

<script src="../components/table.js"></script>
<script src="../components/cards.js"></script>
<script src="../components/sidebar.js"></script>
<script src="../components/navbar.js"></script>
<script src="../js/app.js"></script>
<script src="../js/requests.js"></script>
<script>
  const user = USIAMS.auth.requireAuth();
  if (user) {
    USIAMS.app.mountShell(user);
    USIAMS.requestsPage.initPage(user);
    if (user.role !== "STUDENT" && USIAMS.auth.isReadOnlyRole(user.role)) document.getElementById("submitRequestBtn").remove();
  }
</script>
</body>
</html>
