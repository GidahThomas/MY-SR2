<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results & Transcripts - USIAMS</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Results &amp; Transcripts</h1><p id="resultsStudentName">Loading...</p></div>
        <div class="d-flex gap-2 no-print">
          <button class="btn btn-outline-secondary" id="exportResultsCsvBtn"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV</button>
          <button class="btn btn-outline-secondary" id="printResultsBtn"><i class="bi bi-printer me-1"></i>Print</button>
          <button class="btn btn-primary" id="downloadTranscriptBtn" style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-download me-1"></i>Download Transcript</button>
        </div>
      </div>

      <div class="mb-3 d-none no-print" id="studentSelectorWrap">
        <label class="form-label">Select Student</label>
        <select class="form-select" id="studentSelector" style="max-width:360px;"></select>
      </div>

      <div class="mb-3 no-print" style="max-width:320px;">
        <label class="form-label">Semester</label>
        <select class="form-select" id="resultsSemesterFilter"></select>
      </div>

      <div class="dash-grid-stats" style="grid-template-columns:repeat(4,1fr);">
        <div class="usi-card p-3"><div class="stat-label">Semester GPA</div><button type="button" class="private-value" aria-pressed="false" data-private-label="Semester GPA" aria-label="Show Semester GPA" title="Click to show"><span class="private-content" aria-hidden="true"><div class="stat-value" id="semesterGpaValue">0.00</div><div class="stat-trend up" id="semesterGpaClass"></div></span><i class="bi bi-eye private-eye" aria-hidden="true"></i></button></div>
        <div class="usi-card p-3"><div class="stat-label">Overall GPA</div><button type="button" class="private-value" aria-pressed="false" data-private-label="Overall GPA" aria-label="Show Overall GPA" title="Click to show"><span class="private-content" aria-hidden="true"><div class="stat-value" id="overallGpaValue">0.00</div><div class="stat-trend up" id="overallGpaClass"></div></span><i class="bi bi-eye private-eye" aria-hidden="true"></i></button></div>
        <div class="usi-card p-3"><div class="stat-label">Total Courses Completed</div><div class="stat-value" id="totalCoursesValue">0</div></div>
        <div class="usi-card p-3"><div class="stat-label">Total Credits Earned</div><div class="stat-value" id="creditsEarnedValue">0</div></div>
      </div>

      <div class="dash-grid-charts no-print">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Grade Distribution</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="gradeDistributionChart"></canvas></div></div>
        </div>
        <div class="usi-card">
          <div class="usi-card-header"><h3>Semester GPA Trend</h3></div>
          <div class="usi-card-body"><div class="chart-box"><canvas id="semesterGpaChart"></canvas></div></div>
        </div>
      </div>

      <div class="usi-card print-doc">
        <div class="usi-card-header"><h3>Academic Performance</h3></div>
        <div class="usi-card-body">
          <div class="usi-table-wrap">
            <table class="usi-table">
              <thead><tr><th>Semester</th><th>Code</th><th>Course Title</th><th>Credits</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th></tr></thead>
              <tbody id="resultsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/chart.js/chart.umd.min.js"></script>
<script src="../js/storage.js"></script>
