<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Settings</h1><p>Manage your profile, appearance and notification preferences.</p></div>
      </div>

      <div class="usi-card mb-3">
        <div class="usi-card-body profile-hero">
          <div class="avatar-circle" id="settingsAvatar"></div>
          <div>
            <h2 style="font-size:1.15rem;margin-bottom:.15rem;" id="settingsName"></h2>
            <div class="text-muted-usi" style="font-size:.85rem;" id="settingsRole"></div>
            <div class="text-muted-usi" style="font-size:.8rem;">
              <span id="settingsEmail"></span> &bull; Username: <span id="settingsUsername"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="dash-grid-2col">
        <div class="usi-card">
          <div class="usi-card-header"><h3>Appearance</h3></div>
          <div class="usi-card-body">
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="themeRadio" id="themeRadio-light" value="light">
              <label class="form-check-label" for="themeRadio-light">Light Mode</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="themeRadio" id="themeRadio-dark" value="dark">
              <label class="form-check-label" for="themeRadio-dark">Dark Mode</label>
            </div>
          </div>
        </div>

        <div class="usi-card">
          <div class="usi-card-header"><h3>Notification Preferences</h3></div>
          <div class="usi-card-body">
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
              <span style="font-size:.85rem;">Email Alerts</span>
              <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="pref-emailAlerts"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
              <span style="font-size:.85rem;">SMS Alerts</span>
              <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="pref-smsAlerts"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center py-2">
              <span style="font-size:.85rem;">Weekly Digest Email</span>
              <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="pref-weeklyDigest"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-header"><h3>Change Password</h3></div>
        <div class="usi-card-body">
          <form id="passwordForm" style="max-width:420px;">
            <div class="mb-3"><label class="form-label">Current Password</label><input type="password" class="form-control" id="currentPassword"></div>
            <div class="mb-3"><label class="form-label">New Password</label><input type="password" class="form-control" id="newPassword"></div>
            <div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" id="confirmPassword"></div>
            <div id="passwordFormError" class="alert alert-danger d-none"></div>
            <button type="submit" class="btn btn-primary" style="background:var(--primary);border-color:var(--primary);">Update Password</button>
          </form>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/settings.js"></script>
<script>
  USIAMS.boot(null, (user) => {
    USIAMS.settingsPage.initPage(user);
  });
</script>
</body>
</html>
