<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Directory - USIAMS</title>
<!-- include: app-styles -->
</head>
<body>
<!-- include: app-shell-start -->

      <div class="page-header">
        <div><h1>Staff Directory</h1><p>Academic staff published across the university - lecturers, academic advisors and heads of department.</p></div>
      </div>

      <div id="statGrid" class="dash-grid-stats mb-4"></div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="staffSearchInput" placeholder="Search by name or email"></div>
            <select class="form-select" id="staffDeptFilter" style="max-width:280px;"></select>
          </div>
          <div id="staffDirectoryContainer"></div>
        </div>
      </div>

<!-- include: app-shell-end -->

<!-- include: app-scripts -->
<script src="../js/staff-directory.js"></script>
<script>
  USIAMS.boot(null, (user) => {
    USIAMS.staffDirectoryPage.initPage(user);
  });
</script>
</body>
</html>
