<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management - USIAMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div>
          <h1>Student Management</h1>
          <p>Search, filter and manage the university student register.</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="exportCsvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          <button class="btn btn-outline-secondary write-action d-none" id="bulkAddStudentsBtn" data-write-action><i class="bi bi-people-fill me-1"></i>Bulk Add</button>
          <button class="btn btn-primary write-action" id="addStudentBtn" data-write-action style="background:var(--primary);border-color:var(--primary);"><i class="bi bi-plus-lg me-1"></i>Add Student</button>
        </div>
      </div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="table-toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" class="form-control" id="studentSearchInput" placeholder="Search by name, reg number or email"></div>
            <select class="form-select" id="filterProgramme" style="max-width:220px;"></select>
            <select class="form-select" id="filterYear" style="max-width:140px;">
              <option value="">All Years</option>
              <option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option>
            </select>
            <select class="form-select" id="filterStatus" style="max-width:160px;">
              <option value="">All Statuses</option>
              <option>Active</option><option>On Leave</option><option>Suspended</option><option>Graduated</option>
            </select>
          </div>
          <div id="studentsTableContainer"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  USIAMS.boot(["UNIVERSITY_ADMIN","ACADEMIC_ADVISOR","DEPARTMENT_ADMIN","HEAD_OF_DEPARTMENT","COLLEGE_ADMIN","INSTITUTE_ADMIN","SCHOOL_ADMIN","EXAMINATION_OFFICER","FINANCE_OFFICER","REGISTRATION_OFFICER","QUALITY_ASSURANCE_OFFICER","SYSTEM_ADMIN","LECTURER","LIBRARIAN","HOSTEL_OFFICER"], (user) => {

  });
