<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable - USIAMS</title>
<link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.css">

<body>
<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="sidebarContainer"></aside>
  <div class="app-main">
    <header class="app-navbar" id="navbarContainer"></header>
    <main class="app-content">

      <div class="page-header">
        <div><h1>Weekly Timetable</h1><p id="timetableSubtitle">Loading...</p></div>
      </div>

      <div class="row g-2 mb-3 d-none" id="timetableFilterWrap">
        <div class="col-auto"><select class="form-select" id="timetableProgramme"></select></div>
        <div class="col-auto">
          <select class="form-select" id="timetableYear">
            <option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option>
          </select>
        </div>
      </div>

      <div class="usi-card mb-3 d-none" id="todayClassesCard">
        <div class="usi-card-header"><h3><i class="bi bi-list-check me-1"></i>Today's Classes</h3></div>
        <div class="usi-card-body" id="todayClassesList"></div>
      </div>
      <div class="access-denied-banner d-none" id="conflictBanner" style="background:var(--warning-bg);color:var(--warning);border-color:rgba(181,121,10,.3);"></div>

      <div class="usi-card">
        <div class="usi-card-body">
          <div class="timetable-grid" id="timetableGrid"></div>
        </div>
      </div>

    </main>
  </div>
</div>
